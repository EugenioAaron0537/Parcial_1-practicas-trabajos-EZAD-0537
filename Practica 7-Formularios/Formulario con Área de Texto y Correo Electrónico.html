<!-- FORMULARIO CON TEXTAREA Y EMAIL                                           -->
<!-- Utiliza type="email" para validación nativa de correo electrónico y <textarea> para permitir ingresar comentarios multilínea. -->

<form action="" method="post">
    Ingresa tu nombre:
    <input type="text" name="nombre">
    <br>
    Ingresa tu correo:
    <input type="email" name="correo">
    <br>
    Ingresa tus comentarios:
    <textarea name="comentarios" rows="1" cols="10"></textarea>
    <br>
    <input type="submit" value="enviar">
    <input type="reset" value="borrar">
</form>
