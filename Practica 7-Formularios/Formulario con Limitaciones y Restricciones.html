<!-- FORMULARIO CON LIMITACIONES -->
<!-- Demuestra el uso de: -->
<!-- - disabled: deshabilita la interacción con el campo. -->
<!-- - maxlength: limita la cantidad máxima de caracteres ingresables.-->
<!-- - readonly: permite ver/copiar el contenido pero impide modificarlo.-->

<form action="" method="post">
    Ingresa tu nombre:
    <!-- Campo deshabilitado -->
    <input type="text" name="nombre" disabled><br>
    <!-- Contraseña limitada a máximo 5 caracteres -->
    Contraseña:
    <input type="password" name="pass" maxlength="5"><br>
    <!-- Campo de solo lectura -->
    Comentarios:
    <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>
</form>
